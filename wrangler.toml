name = "forge-gateway"
main = "src/index.ts"
compatibility_date = "2026-09-11"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PresenceRegistry"]

[vars]
# Where the pairing-token relay calls back to (POST /api/gateway/sessions).
# Not secret. This is the deployed default (production Forge); local dev
# overrides it via .dev.vars (gitignored, not committed) so `wrangler dev`
# still points at localhost.
FORGE_CALLBACK_URL = "https://forge.harithkavish.com"

# GATEWAY_SHARED_SECRET is a secret, not a var -- set it with:
#   wrangler secret put GATEWAY_SHARED_SECRET
# Never committed here. Must match Forge's own GATEWAY_SHARED_SECRET exactly
# -- it signs/verifies pairing tokens on Forge's side, authenticates this
# Worker's callback to Forge, and (as the verification key here) is what lets
# this Worker check a pairing or viewer token's signature without a round
# trip to Forge. See README.md.
